<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Home</title>
        <style>
            body {
                margin: 0;
                font-family: -apple-system, system-ui, sans-serif;
                background: #f6f7f9;
                color: #111827;
            }
            .status-bar {
                height: 44px;
                background: #fff;
            }
            header {
                padding: 16px 20px;
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            h1 {
                margin: 0;
                font-size: 22px;
            }
            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2563eb;
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 600;
                font-size: 14px;
            }
            .section {
                padding: 20px;
            }
            .greeting {
                color: #6b7280;
                font-size: 14px;
                margin-bottom: 4px;
            }
            .name {
                font-size: 26px;
                font-weight: 600;
                margin-bottom: 20px;
            }
            .card {
                background: #fff;
                border-radius: 14px;
                padding: 18px;
                margin-bottom: 12px;
                border: 1px solid #e5e7eb;
            }
            .card-title {
                font-weight: 600;
                font-size: 15px;
                margin: 0 0 6px;
            }
            .card-sub {
                color: #6b7280;
                font-size: 13px;
                margin: 0;
            }
            .big-card {
                background: linear-gradient(135deg, #2563eb, #7c3aed);
                color: #fff;
                padding: 24px;
                border-radius: 16px;
                margin-bottom: 16px;
            }
            .big-card .title {
                font-size: 15px;
                opacity: 0.9;
            }
            .big-card .value {
                font-size: 32px;
                font-weight: 700;
                margin-top: 4px;
            }
            .tabbar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 72px;
                background: #fff;
                border-top: 1px solid #e5e7eb;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                align-items: center;
                justify-items: center;
                font-size: 11px;
                color: #6b7280;
            }
            .tab {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            .tab.active {
                color: #2563eb;
            }
            .dot {
                width: 20px;
                height: 20px;
                border-radius: 4px;
                background: currentColor;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <div class="status-bar"></div>
        <header>
            <h1>Home</h1>
            <div class="avatar">A</div>
        </header>
        <div class="section">
            <div class="greeting">Good morning,</div>
            <div class="name">Alex</div>
            <div class="big-card">
                <div class="title">Balance</div>
                <div class="value">$4,280.50</div>
            </div>
            <div class="card">
                <div class="card-title">Coffee at Nero</div>
                <p class="card-sub">Today, 9:12 · –$4.80</p>
            </div>
            <div class="card">
                <div class="card-title">Salary</div>
                <p class="card-sub">Yesterday · +$3,200.00</p>
            </div>
            <div class="card">
                <div class="card-title">Groceries</div>
                <p class="card-sub">Apr 20 · –$68.40</p>
            </div>
        </div>
        <nav class="tabbar">
            <div class="tab active">
                <div class="dot"></div>
                Home
            </div>
            <div class="tab">
                <div class="dot"></div>
                Cards
            </div>
            <div class="tab">
                <div class="dot"></div>
                Send
            </div>
            <div class="tab">
                <div class="dot"></div>
                More
            </div>
        </nav>
    </body>
</html>
